name: 品質検査

on:
  push:
  pull_request:

jobs:
  php:
    name: PHP ${{ matrix.php }} 検査
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP構文検査
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: 品質検査ツールのインストール
        if: matrix.php == '8.3'
        run: composer install --no-interaction --prefer-dist
      - name: コーディング規約検査
        if: matrix.php == '8.3'
        run: composer lint
